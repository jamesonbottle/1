name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets tagged builds attach a zip to a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Self-contained + unpackaged: the output folder includes the .NET runtime and the Windows App SDK,
      # so it runs on a clean Windows 10 1809+ / Windows 11 machine with nothing installed.
      - name: Publish
        run: dotnet publish ScreenTime.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} --self-contained true -o publish/${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTime-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

      # Push a tag like v1.0 to get a public download on the Releases page (no GitHub login needed to download).
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath ScreenTime-${{ matrix.rid }}.zip
          gh release create ${{ github.ref_name }} --generate-notes
          gh release upload ${{ github.ref_name }} ScreenTime-${{ matrix.rid }}.zip --clobber
